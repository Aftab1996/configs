$font = JetBrains Mono
general {
    hide_cursor = false
}
# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }


animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}
#password background

shape {
    monitor =
    size = 360, 100
    color = rgb(220, 138, 120)
    rounding = 0
    border_size = 0
    position = 0,150
    halign = center
    valign = center
    zindex = 0
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0) 
    outer_color = rgba(0, 0, 0, 0)
    check_color = rgba(00ff99ee)
    fail_color = rgba(ff6633ee)
    font_color = rgb(220, 224, 232)
    fade_on_empty = false
    rounding = 0
    font_family = JetBrains Mono
    placeholder_text = welcome
    fail_text = wrong password
    # dots_text_format = *
    # dots_size = 0.4
    dots_spacing = 0.3
    # hide_input = true
    position = 00, 150
    halign = center
    valign = center
}
background {
    monitor =
    color = rgb(81, 87, 109)
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}
listener {
    timeout = 1
    on-timeout = /home/tipu/.config/hypr/hpyrlock.conf
}
#date and time background 
shape {
    monitor =
    size = 360, 380
    color = rgb(136, 57, 239)
    rounding = 0
    border_size = 0
    position = 0,-100
    halign = center
    valign = center
    zindex = 0
}
# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = rgba(216, 222, 233, .7)
    font_size = 20
    font_family = Adwaita Mono
    position = -0, -100
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(216, 222, 233, .7)
    font_size = 15
    font_family = $font
    position = 0, -200
    halign = center
    valign = center
}
shape {
    monitor =
    size = 360, 50
    color = rgb(188, 192, 204)
    rounding = 0
    border_size = 0
    position = 0,-280
    halign = center
    valign = top
    zindex = 0
}

# Reboot
label {
    monitor =
    text =  󰜉 
    color = rgba(255, 255, 255, 0.6)
    font_size = 20
    onclick = reboot now
    position = 0, -290
    halign = center
    valign = top



